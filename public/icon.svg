<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17232D"/>
      <stop offset="100%" stop-color="#101923"/>
    </linearGradient>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5D5C8"/>
      <stop offset="100%" stop-color="#A3BFA8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#30404A" stroke-width="6"/>
  <!-- Central flowing lotus / flow symbol -->
  <g transform="translate(256, 256)">
    <circle r="140" fill="none" stroke="#30404A" stroke-width="4" stroke-dasharray="8 8" opacity="0.6"/>
    <!-- Flow loop -->
    <path d="M-80 -40 C-80 -100, 0 -110, 0 -40 C0 30, 80 40, 80 100 C80 150, 0 140, 0 80" fill="none" stroke="url(#sageGrad)" stroke-width="26" stroke-linecap="round"/>
    <path d="M80 40 C80 100, 0 110, 0 40 C0 -30, -80 -40, -80 -100 C-80 -150, 0 -140, 0 -80" fill="none" stroke="#A3BFA8" stroke-width="20" stroke-linecap="round" opacity="0.4"/>
    <!-- Checkmark accent -->
    <circle cx="50" cy="-50" r="14" fill="#A3BFA8" filter="url(#glow)"/>
    <circle cx="-50" cy="50" r="10" fill="#C5D5C8"/>
  </g>
</svg>
